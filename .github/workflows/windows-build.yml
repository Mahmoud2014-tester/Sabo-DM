name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23.x"
          cache: false # go.sum is generated by the Resolve dependencies step below

      - name: Resolve dependencies
        shell: pwsh
        run: go mod tidy

      - name: Run Go tests
        shell: pwsh
        run: go test ./...

      - name: Install Windows resource compiler
        shell: pwsh
        run: go install github.com/akavel/rsrc@latest

      - name: Generate Windows resources
        shell: pwsh
        run: |
          $gopath = go env GOPATH
          & "$gopath\bin\rsrc.exe" -manifest Sabo-DM.manifest -o rsrc.syso

      - name: Build GUI executable
        shell: pwsh
        run: |
          $version = "1.3.2-dev"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}"
          }
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.AppVersion=$version" -o Sabo-DM.exe .

      - name: Build diagnostic executable
        shell: pwsh
        run: |
          $version = "1.3.2-dev"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          go build -trimpath -tags dev -ldflags="-X main.AppVersion=$version" -o Sabo-DM-Diagnostic.exe .

      - name: Package browser extension
        shell: pwsh
        run: Compress-Archive -Path extension\* -DestinationPath Sabo-DM-Extension.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sabo-DM-Windows-${{ github.sha }}
          path: |
            Sabo-DM.exe
            Sabo-DM-Diagnostic.exe
            Sabo-DM-Extension.zip
          if-no-files-found: error
