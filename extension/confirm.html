<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title><span data-i18n="title">Download with Sabo DM</span></title><style>
*{box-sizing:border-box}body{margin:0;padding:clamp(12px,4vw,24px);background:#f4f7fb;color:#172033;font:14px "Segoe UI",Arial,sans-serif;min-width:0}*{min-width:0}.card{width:100%;max-width:720px;margin:0 auto;background:white;border:1px solid #dce3ee;border-radius:16px;padding:clamp(14px,4vw,22px);box-shadow:0 8px 30px #17203312;overflow-wrap:anywhere}h1{font-size:clamp(18px,4vw,20px);line-height:1.35;margin:0 0 8px;overflow-wrap:anywhere}.muted{color:#667085;margin:0 0 20px;line-height:1.5;overflow-wrap:anywhere}.file{display:flex;gap:12px;align-items:flex-start;background:#f7f9fc;border-radius:10px;padding:14px;margin-bottom:16px}.ico{font-size:28px;flex:0 0 auto}.name{font-weight:650;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.45}.details{color:#667085;font-size:12px;margin-top:5px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid #edf0f5}.row span,.row strong{overflow-wrap:anywhere;word-break:break-word}.row strong{text-align:end;max-width:65%}.row:last-child{border:0}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:20px}.actions button{min-width:0;min-height:44px;white-space:normal;overflow-wrap:anywhere;word-break:normal;line-height:1.35;border:0;border-radius:9px;padding:10px 8px;font-weight:650;cursor:pointer}.primary{background:#2563eb;color:white}.queue{background:#e7efff;color:#1948a8}.cancel{background:#eef1f5;color:#344054;grid-column:1/-1}.status{min-height:18px;margin-top:12px;color:#b42318;font-size:12px;line-height:1.45;overflow-wrap:anywhere}.small{font-size:11px;color:#667085;margin-top:14px;line-height:1.5;overflow-wrap:anywhere}html[dir="rtl"] .row{flex-direction:row-reverse}html[dir="rtl"] .row strong{text-align:start}html[dir="rtl"] .file{flex-direction:row-reverse}html[dir="rtl"] .name,html[dir="rtl"] .details{text-align:right}
</style></head><body><main class="card"><h1><span data-i18n="title">Download with Sabo DM</span></h1><p class="muted"><span data-i18n="subtitle">Review the file before starting the download.</span></p><div class="file"><div class="ico">⬇</div><div style="min-width:0"><div class="name" id="name">Loading…</div><div class="details" id="url"></div></div></div><div class="row"><span><span data-i18n="fileType">File type</span></span><strong id="type">—</strong></div><div class="row"><span><span data-i18n="fileSize">File size</span></span><strong id="size">Unknown</strong></div><div class="row"><span><span data-i18n="source">Source</span></span><strong id="source">Website</strong></div><div class="actions"><button class="primary" id="download"><span data-i18n="download">Download File</span></button><button class="queue" id="queue"><span data-i18n="queue">Add to Queue</span></button><button class="cancel" id="cancel"><span data-i18n="cancel">Cancel Download</span></button></div><div class="status" id="status" role="status"></div><div class="small"><span data-i18n="note">Some websites hide file size until the transfer begins. Media streams may not have a single known size.</span></div></main><script src="confirm.js"></script></body></html>
